name: CorrerIA
version: "1.40.0"
slug: correria
description: Os apps no WhatsApp (API oficial da Meta) e em outras IAs (MCP). Pergunte, lance e marque como feito, com a IA.
url: https://github.com/diegozapella63/CorrerIA-ha
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:message-flash
panel_title: CorrerIA
homeassistant_api: true
ports:
  8443/tcp: 8443
  8444/tcp: 8444
ports_description:
  8443/tcp: WhatsApp e o conector MCP (https; encaminhe no roteador)
  8444/tcp: O túnel da Cloudflare (http; só na rede de casa, não encaminhe no roteador)
map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true
watchdog: "tcp://[HOST]:[PORT:8099]"
