name: CorrerIA
version: "0.5.0"
slug: correria
description: Os apps da casa no WhatsApp (API oficial da Meta), no Claude e no Gemini (MCP). Pergunte, lance e marque como feito, com a IA.
url: https://github.com/diegozapella63/CorrerIA-ha
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:message-flash
panel_title: CorrerIA
homeassistant_api: true
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: WhatsApp e o conector do Claude e do Gemini (https; encaminhe no roteador)
map:
  - type: share
    read_only: true
  - type: ssl
    read_only: true
watchdog: "tcp://[HOST]:[PORT:8099]"
